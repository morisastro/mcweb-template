services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcweb
      POSTGRES_PASSWORD: mcweb
      POSTGRES_DB: mcweb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcweb -d mcweb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://mcweb:mcweb@db:5432/mcweb?schema=public
      # Secrets MUST be provided via .env (docker compose reads it automatically)
    ports:
      - "3000:3000"
    env_file:
      - .env

volumes:
  postgres-data:
